<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中3数学｜立体の体積 3Dシミュレーション</title><style>body{margin:0;font-family:system-ui,'Yu Gothic',sans-serif;background:#f2f5fa;color:#17243a}.app{max-width:1250px;margin:auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.panel,.stage{background:white;border-radius:14px;box-shadow:0 2px 12px #152c4514;padding:14px}.panel button{width:100%;margin:5px 0;padding:12px;border:1px solid #ccd5e0;border-radius:9px;background:#f6f8fc;text-align:left;font-weight:bold;font-size:15px;cursor:pointer}.panel button.active{background:#e2efff;border-color:#2577ca}.stage{min-height:590px;position:relative}canvas{width:100%;height:530px;touch-action:none;display:block}.hint{color:#536276;font-size:13px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.info{background:#edf3fb;padding:12px;border-radius:8px;line-height:1.7;font-size:14px}#reset{margin-top:8px}.legend{font-size:14px;margin:12px 0}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}@media(max-width:760px){.layout{grid-template-columns:1fr}.stage{min-height:400px}canvas{height:390px}}</style></head><body><div class="app"><h1>中学3年 数学｜立体の体積　3Dシミュレーション</h1><div class="layout"><aside class="panel"><b>表示する立体</b><div id="buttons"></div><button id="reset">↺ 視点を元に戻す</button><div class="checks"><label><input id="labels" type="checkbox" checked> 頂点名</label><label><input id="wire" type="checkbox" checked> 直方体の枠</label></div><div class="info"><b>問題図の頂点配置</b><br>上面：A（手前左）、B（手前右）、C（奥右）、D（奥左）<br>下面：E（手前左）、F（手前右）、G（奥右）、H（奥左）<br>I は EF 上（EI=4cm、IF=2cm）<br>J は AB 上（AJ=4cm）</div></aside><main class="stage"><div id="heading" style="font-size:19px;font-weight:750"></div><div class="hint">ドラッグ：回転　／　ホイール：拡大・縮小　／　タッチ操作にも対応</div><canvas id="cv"></canvas><div id="desc" class="info"></div><div class="legend"><span class="sw" style="background:#2ab56a"></span>四角錐 I-AEGC　 <span class="sw" style="background:#3e82ef"></span>三角柱 AJC-EIG　 <span class="sw" style="background:#f29a32"></span>三角錐 C-AIJ</div></main></div></div><script>
(()=>{'use strict';const P={A:[0,0,3],B:[6,0,3],C:[6,4,3],D:[0,4,3],E:[0,0,0],F:[6,0,0],G:[6,4,0],H:[0,4,0],I:[4,0,0],J:[4,0,3]};const prism=[['A','J','C'],['E','I','G'],['A','J','I','E'],['J','C','G','I'],['C','A','E','G']];const pyramid=[['A','E','G','C'],['I','A','E'],['I','E','G'],['I','G','C'],['I','C','A']];const tetra=[['A','I','J'],['C','A','I'],['C','I','J'],['C','J','A']];const boxfaces=[['A','B','C','D'],['E','F','G','H'],['A','B','F','E'],['B','C','G','F'],['C','D','H','G'],['D','A','E','H']];const modes=[['① 直方体全体','問題の直方体。EF=6cm、AD=4cm、AE=3cm。'],['② 四角錐 I-AEGC','求める立体。頂点 I、底面 AEGC。'],['③ 三角柱 AJC-EIG','大きな三角柱。体積は 1/2×4×4×3 = 24cm³。'],['④ 三角錐 C-AIJ','取り除く三角錐。体積は 1/3×(1/2×4×3)×4 = 8cm³。'],['⑤ 引き算の構造','青い三角柱から橙色の三角錐を除くと、緑色の四角錐。24−8=16cm³。'],['⑥ 四角錐＋三角錐（同時表示）','緑：求める四角錐 I-AEGC（面あり）／橙の点線：三角錐 C-AIJ（輪郭線のみ・面の塗りなし）。']];let mode=0,az=-.60,el=.32,zoom=1,drag=null;const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),btns=document.getElementById('buttons');modes.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m[0];b.onclick=()=>{mode=i;update()};btns.appendChild(b)});function update(){[...btns.children].forEach((b,i)=>b.classList.toggle('active',i===mode));document.getElementById('heading').textContent=modes[mode][0];document.getElementById('desc').textContent=modes[mode][1];draw()};function view(p){let x=p[0]-3,y=p[1]-2,z=p[2]-1.5;let ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);let xx=x*ca+y*sa, yy=-x*sa+y*ca;return [xx,yy*se+z*ce,yy*ce-z*se]};function draw(){let r=cv.getBoundingClientRect(),w=r.width,h=r.height,dpr=devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let sc=Math.min(w/11,h/8)*zoom;const projected={};Object.keys(P).forEach(k=>{let v=view(P[k]);projected[k]=[w/2+v[0]*sc,h/2-v[1]*sc,v[2]]});function poly(ids,fill,stroke,alpha=1){ctx.beginPath();ids.forEach((k,i)=>{let p=projected[k];i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.closePath();ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.7;ctx.stroke();ctx.globalAlpha=1}let faces=[];function add(arr,color,opacity){arr.forEach(f=>faces.push({f,color,opacity,depth:f.reduce((s,k)=>s+projected[k][2],0)/f.length}))}if(mode===0)add(boxfaces,'#b7d6f3',.18);if(mode===1)add(pyramid,'#2ab56a',.36);if(mode===2)add(prism,'#3e82ef',.32);if(mode===3)add(tetra,'#f29a32',.43);if(mode===4){add(prism,'#3e82ef',.17);add(tetra,'#f29a32',.5)}if(mode===5){add(pyramid,'#2ab56a',.30)}faces.sort((a,b)=>b.depth-a.depth).forEach(o=>poly(o.f,o.color,o.color,o.opacity));let edges=[['A','B'],['B','C'],['C','D'],['D','A'],['E','F'],['F','G'],['G','H'],['H','E'],['A','E'],['B','F'],['C','G'],['D','H']];function line(a,b,color,width,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(...projected[a].slice(0,2));ctx.lineTo(...projected[b].slice(0,2));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}if(document.getElementById('wire').checked)edges.forEach(([a,b])=>line(a,b,'#788697',1.1,(['D','H'].includes(a)||['D','H'].includes(b))?[5,4]:[]));let drawEdges=(faces,col,dash=[])=>{let seen=new Set();faces.forEach(f=>f.forEach((a,i)=>{let b=f[(i+1)%f.length],id=[a,b].sort().join('');if(!seen.has(id)){seen.add(id);line(a,b,col,2.4,dash)}}))};if(mode===1)drawEdges(pyramid,'#16945a');if(mode===2)drawEdges(prism,'#1f61c5');if(mode===3)drawEdges(tetra,'#c77a13');if(mode===4){drawEdges(prism,'#2768cc');drawEdges(tetra,'#db7c12')}if(mode===5){drawEdges(pyramid,'#16945a');drawEdges(tetra,'#db7c12',[6,5])}if(mode!==0){line('I','J','#8b50bb',1.6,[5,4])}let names=document.getElementById('labels').checked?(mode===0?Object.keys(P):Object.keys(P)):[];names.forEach(k=>{let p=projected[k];ctx.beginPath();ctx.arc(p[0],p[1],k==='I'?5:3.5,0,Math.PI*2);ctx.fillStyle=k==='I'?'#d21b87':k==='J'?'#8346cc':'#1c2d41';ctx.fill();ctx.font='bold 15px system-ui';ctx.lineWidth=3;ctx.strokeStyle='white';let ox=k==='I'?0:((k==='B'||k==='C'||k==='F'||k==='G')?11:-11),oy=k==='I'?21:-10;ctx.textAlign='center';ctx.strokeText(k,p[0]+ox,p[1]+oy);ctx.fillStyle='#152338';ctx.fillText(k,p[0]+ox,p[1]+oy)});if(mode===0){ctx.font='14px system-ui';ctx.fillStyle='#253b59';ctx.fillText('EI = 4 cm / IF = 2 cm',w/2,h-12)}}cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;az+=(e.clientX-drag[0])*.009;el=Math.max(-1.45,Math.min(1.45,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.8,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});document.getElementById('reset').onclick=()=>{az=-.60;el=.32;zoom=1;draw()};document.getElementById('labels').onchange=draw;document.getElementById('wire').onchange=draw;window.addEventListener('resize',draw);update()})();
</script></body></html>
